name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Criar projeto
        run: |
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "CentralCarro"
          include(":app")
          EOF_FILE
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.central.carro"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.central.carro"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_FILE
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application
                  android:label="Central Carro"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p $(dirname app/src/main/java/com/central/carro/MainActivity.kt)
          cat > app/src/main/java/com/central/carro/MainActivity.kt <<'EOF_FILE'
          package com.central.carro

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.*
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : Activity() {

              data class AppItem(val label: String, val icon: Drawable, val intent: Intent)

              private val apps = mutableListOf<AppItem>()
              private lateinit var clock: TextView
              private lateinit var date: TextView
              private lateinit var adapter: BaseAdapter
              private val handler = Handler(Looper.getMainLooper())
              private val tick = object : Runnable {
                  override fun run() {
                      val now = Date()
                      clock.text = SimpleDateFormat("HH:mm", Locale.getDefault()).format(now)
                      date.text = SimpleDateFormat("EEEE, dd 'de' MMMM", Locale("pt", "BR")).format(now)
                      handler.postDelayed(this, 10_000)
                  }
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun button(text: String, onClick: () -> Unit) = Button(this).apply {
                  this.text = text
                  setTextColor(Color.WHITE)
                  textSize = 18f
                  isAllCaps = false
                  minimumHeight = dp(64)
                  background = GradientDrawable().apply {
                      cornerRadius = dp(16).toFloat()
                      setColor(Color.parseColor("#1E2A38"))
                  }
                  setOnClickListener { onClick() }
              }

              private fun launch(intent: Intent) {
                  try {
                      startActivity(intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  } catch (e: Exception) {
                      Toast.makeText(this, "App não encontrado", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun askDefault() {
                  try {
                      startActivity(Intent(Settings.ACTION_HOME_SETTINGS))
                  } catch (e: Exception) {
                      launch(Intent(Settings.ACTION_SETTINGS))
                  }
              }

              private fun loadApps() {
                  val pm = packageManager
                  val q = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val list = pm.queryIntentActivities(q, 0)
                      .filter { it.activityInfo.packageName != packageName }
                      .map {
                          AppItem(
                              it.loadLabel(pm).toString(),
                              it.loadIcon(pm),
                              Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                                  .setClassName(it.activityInfo.packageName, it.activityInfo.name)
                          )
                      }
                      .sortedBy { it.label.lowercase() }
                  apps.clear(); apps.addAll(list)
                  adapter.notifyDataSetChanged()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#0B0F14"))
                      setPadding(dp(24), dp(16), dp(24), dp(16))
                  }

                  // Barra superior: relógio + botão padrão
                  val top = LinearLayout(this).apply { gravity = Gravity.CENTER_VERTICAL }
                  clock = TextView(this).apply { textSize = 56f; setTextColor(Color.WHITE) }
                  date = TextView(this).apply {
                      textSize = 18f; setTextColor(Color.parseColor("#8FA3B8")); setPadding(dp(20), 0, 0, 0)
                  }
                  val spacer = View(this)
                  top.addView(clock)
                  top.addView(date)
                  top.addView(spacer, LinearLayout.LayoutParams(0, 1, 1f))
                  top.addView(button("Definir como padrão") { askDefault() })
                  root.addView(top)

                  // Grade com todos os apps instalados
                  adapter = object : BaseAdapter() {
                      override fun getCount() = apps.size
                      override fun getItem(p: Int) = apps[p]
                      override fun getItemId(p: Int) = p.toLong()
                      override fun getView(p: Int, v: View?, parent: ViewGroup): View {
                          val item = apps[p]
                          return LinearLayout(this@MainActivity).apply {
                              orientation = LinearLayout.VERTICAL
                              gravity = Gravity.CENTER
                              setPadding(dp(8), dp(12), dp(8), dp(12))
                              addView(ImageView(context).apply { setImageDrawable(item.icon) },
                                  LinearLayout.LayoutParams(dp(72), dp(72)))
                              addView(TextView(context).apply {
                                  text = item.label; textSize = 15f; maxLines = 1
                                  setTextColor(Color.WHITE); gravity = Gravity.CENTER
                                  ellipsize = android.text.TextUtils.TruncateAt.END
                              })
                          }
                      }
                  }
                  val grid = GridView(this).apply {
                      numColumns = 6
                      verticalSpacing = dp(8)
                      selector = android.graphics.drawable.ColorDrawable(Color.TRANSPARENT)
                      this.adapter = this@MainActivity.adapter
                      setOnItemClickListener { _, _, p, _ -> launch(apps[p].intent) }
                  }
                  root.addView(grid, LinearLayout.LayoutParams(-1, 0, 1f).apply { topMargin = dp(12) })

                  // Dock inferior com atalhos
                  val dock = LinearLayout(this).apply { gravity = Gravity.CENTER }
                  fun dockBtn(t: String, i: Intent) = dock.addView(
                      button(t) { launch(i) },
                      LinearLayout.LayoutParams(0, -2, 1f).apply { setMargins(dp(6), 0, dp(6), 0) }
                  )
                  dockBtn("♪ Música", Intent.makeMainSelectorActivity(Intent.ACTION_MAIN, Intent.CATEGORY_APP_MUSIC))
                  dockBtn("➤ Mapas", Intent.makeMainSelectorActivity(Intent.ACTION_MAIN, Intent.CATEGORY_APP_MAPS))
                  dockBtn("✆ Telefone", Intent(Intent.ACTION_DIAL))
                  dockBtn("⚙ Ajustes", Intent(Settings.ACTION_SETTINGS))
                  root.addView(dock, LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(8) })

                  setContentView(root)
              }

              override fun onResume() {
                  super.onResume()
                  window.decorView.systemUiVisibility = (View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_FULLSCREEN
                          or View.SYSTEM_UI_FLAG_LAYOUT_STABLE)
                  loadApps()
                  handler.post(tick)
              }

              override fun onPause() {
                  handler.removeCallbacks(tick)
                  super.onPause()
              }

              @Deprecated("Launcher: não sair ao voltar")
              override fun onBackPressed() { /* launcher não fecha */ }
          }
          EOF_FILE
          echo 'org.gradle.jvmargs=-Xmx2g' > gradle.properties
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CentralCarro.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Central Carro v${{ github.run_number }}
          files: CentralCarro.apk
